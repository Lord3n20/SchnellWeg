# Baut bei einem Tag „routing-jobs-v<version>“ bzw. „valhalla-v<version>“ das passende Image und legt es als
# ghcr.io/lord3n20/schnellweg-<name>:<version> ab (D-03). Kontext = Repo-Wurzel. Actions per Commit-SHA festgelegt.
name: routing-jobs/valhalla-Image

on:
  push:
    tags: ["routing-jobs-v*", "valhalla-v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name und Version aus dem Tag
        id: v
        run: |
          name="${GITHUB_REF_NAME%-v*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_OUTPUT"
          echo "file=server/Dockerfile.${name#routing-}" >> "$GITHUB_OUTPUT"
      - name: Tests
        if: steps.v.outputs.name == 'routing-jobs'
        working-directory: server
        run: docker run --rm -v "$PWD":/src -v "$PWD/../config":/config -w /src golang:1.27.3-alpine@sha256:d200d2dd76b03a99b52651fd1325aff7dcd35422c35c01bac56571b0507f3deb sh -c "go vet ./... && go test ./..."
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ${{ steps.v.outputs.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/lord3n20/schnellweg-${{ steps.v.outputs.name }}:${{ steps.v.outputs.version }}
      - name: Digest
        run: echo "ghcr.io/lord3n20/schnellweg-${{ steps.v.outputs.name }}:${{ steps.v.outputs.version }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
